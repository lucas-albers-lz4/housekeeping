# Defaults for multi-repo cleanup scans.
# Override with --owner / --gitroot / --config.

owner = "lucas-albers-lz4"
gitroot = "~/gitroot"
out_dir = "out"

# Repos whose open issues/PRs are often agent-pipeline work, not human cleanup backlog.
# Always inspect labels before classifying as debt.
pipeline_repos = ["sre-ai-llm-work"]

# Labels that mean "leave to workflow" (extend as needed).
pipeline_labels = [
  "pipeline",
  "no-triage",
  "source-note",
  "guide-update",
  "miner-eval",
  "new-source",
  "new-seed",
  "mining-queued",
  "mining-complete",
  "source-submission",
  "triaged:text",
  "triaged:failure",
  "triaged:repo",
  "pre-screen:pass",
]

# Never suggest merging PRs with these labels.
never_merge_labels = ["miner-eval"]

# Forks you actively maintain — treat hygiene gaps as fix-direct, not park.
active_forks = [
  "cert-manager-webhook-duckdns",
  "helm-whatup",
  "docker-duckdns",
  "jobs-filterer-for-linkedin",
  "NorseWorld-Ragnarok",
  "easy-aws-login",
]

# Owned repos to park (class/experiment clones, not active debt).
parked_repos = [
  "at-3099246",
]

# Repos that intentionally have no CI (ship nothing / no released artifacts).
# Skips the `missing_ci_workflow` finding. Dependabot/security settings still apply.
no_ci_repos = [
  "housekeeping",
]

# Security-sensitive repos that must have a SECURITY.md disclosure policy.
# The scan emits `missing_security_policy` when one of these lacks it.
security_repos = [
  "usrmanage",
  "fwlive",
]

# Suggest-only stale merged-branch cleanup (scan never deletes).
# Skipped automatically for pipeline_repos, parked_repos, non-active forks.
[branch_cleanup]
enabled = true
merged_retention_days = 30
max_merged_prs = 100
max_list = 15
protected_names = [
  "main",
  "master",
  "develop",
  "dev",
  "staging",
  "production",
  "gh-pages",
]
protected_prefixes = [
  "release/",
  "dependabot/",
  "renovate/",
]

# Suggest-only README badges + GitHub About (description/topics).
# Scan never edits READMEs or settings. Skip with --skip-readme-polish.
[readme_polish]
enabled = true

# Solo-owner: do not require/suggest approving reviews (self-approve forbidden).
# Set true only when a second reviewer is intentional.
[branch_protection]
require_approving_reviews = false

# Min major for first-party actions still on the Node 20 *action runtime*
# below these versions (GitHub forces Node 24; bump majors to clear CI warnings).
# Job `node-version:` / setup-python version are unrelated.
[node20_action_min_majors]
"actions/checkout" = 5
"actions/setup-node" = 5
"actions/setup-python" = 6
"actions/cache" = 5
"actions/upload-artifact" = 5
"actions/download-artifact" = 5
