# Example config for the housekeeping scanner.
# Copy to config.toml and set owner (required):
#   cp config.example.toml config.toml
#
# Override on the CLI: --owner / --gitroot / --config
#
# Scope: `owner` is the only GitHub user/org this toolkit targets. Agents and
# scripts must not scan or open drive-by PRs/issues outside that owner. Forks
# of this repo should set their own owner and keep that boundary (see AGENTS.md).

owner = "YOUR_GITHUB_USER_OR_ORG"
gitroot = "~/gitroot"
out_dir = "out"

# Repos whose issues/PRs are agent/pipeline work — leave labeled items alone.
pipeline_repos = []

# Labels that mean "leave to workflow" (extend as needed).
pipeline_labels = []

# Never suggest merging PRs with these labels.
never_merge_labels = []

# Forks you actively maintain — treat hygiene gaps as fix-direct, not park.
active_forks = []

# Owned repos to park (class/experiment clones, not active debt).
parked_repos = []

# Repos that intentionally have no CI (ship nothing / no released artifacts).
# Skips the `missing_ci_workflow` finding. Dependabot/security settings still apply.
no_ci_repos = []

# Security-sensitive repos that must have a SECURITY.md disclosure policy.
# The scan emits `missing_security_policy` when one of these lacks it.
security_repos = []

# Suggest-only stale merged-branch cleanup (scan never deletes).
# Skipped automatically for pipeline_repos, parked_repos, non-active forks.
[branch_cleanup]
enabled = true
merged_retention_days = 30
max_merged_prs = 100
max_list = 15
protected_names = [
  "main",
  "master",
  "develop",
  "dev",
  "staging",
  "production",
  "gh-pages",
]
protected_prefixes = [
  "release/",
  "dependabot/",
  "renovate/",
]

# Suggest-only README badges + GitHub About (description/topics).
# Scan never edits READMEs or repo settings. Disable with enabled = false or:
#   python3 scripts/scan.py --skip-readme-polish
[readme_polish]
enabled = true

# Default-branch protection hygiene + apply guardrails.
# Solo-owner default (false): do not suggest/require approving reviews — GitHub
# forbids self-approve, so count>=1 bricks owner/agent merges without --admin.
# Set true only when a second human can approve PRs (team repos).
[branch_protection]
require_approving_reviews = false

# Min major for first-party actions still on the Node 20 *action runtime*
# below these versions. Job node-version / language toolchain pins are unrelated.
[node20_action_min_majors]
"actions/checkout" = 5
"actions/setup-node" = 5
"actions/setup-python" = 6
"actions/cache" = 5
"actions/upload-artifact" = 5
"actions/download-artifact" = 5

# CodeQL default-setup query suite floor. The REST API only accepts
# `default` | `extended`, so `extended` (default) is the achievable floor;
# `default` triggers `codeql_default_query_suite`. Set to "default" to disable.
# Stronger suites (security-and-quality) are reachable via a CodeQL config
# file (github-codeql-config-file repo property) — raise the floor accordingly.
[codeql]
required_query_suite = "extended"

# Suggest-only actionlint + zizmor on the default-branch tree (REST materialize).
# Binaries are resolved from PATH when paths are empty. If a binary is not on
# PATH, that linter is skipped (not a clean bill). zizmor always runs --offline.
# Findings are suggest-only — never auto-fix, never a gate.
# zizmor_min_severity controls counted findings, not whether the tool runs.
# Personas: regular | pedantic | auditor (there is no "extra"). Skip with:
#   python3 scripts/scan.py --skip-workflow-linters
[workflow_linters]
enabled = true
actionlint_path = ""
zizmor_path = ""
zizmor_min_severity = "high"
zizmor_persona = "regular"

# Opt-in instruction-surface audit (AGENTS.md / rules / skills).
# NEVER read by scan.py. Forkers: leave empty. Only
#   python3 scripts/audit_agents.py --repos <name>
# runs this pass, and only for named repos.
[instruction_audit]
long_form_repos = []
